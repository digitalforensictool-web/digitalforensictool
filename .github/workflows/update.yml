name: Update and publish

on:
  push:
    branches: [main]
  schedule:
    # Every day at 02:17 UTC (07:47 India time)
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Refresh versions, download links and project health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh.py

      - name: Build the site
        run: python scripts/build.py

      - name: Check the built site
        run: python scripts/check.py

      - name: Save refreshed data
        run: |
          git config user.name "site-updater"
          git config user.email "site-updater@users.noreply.github.com"
          git add data/releases.json data/review.md
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh release data [skip ci]"
            git push || echo "Could not save the refreshed data this time. It will be saved on the next run."
          fi

      - name: Prepare for GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
